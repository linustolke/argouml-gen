services:
    docker:
        restart: always
        image: docker:dind
        volumes:
          - jenkins-docker-certs:/certs/client
          - jenkins-data:/var/jenkins_home
        environment:
          - 'DOCKER_TLS_CERTDIR=/certs'
        ports:
          - '2376:2376'
        privileged: true
        command: ["sh", "-c", "dockerd-entrypoint.sh & sleep 20 && docker run --rm -v maven-repo-matrix:/m maven:3-ibmjava-8 chown 1000:1000 /m && wait"]

    myjenkins:
        restart: on-failure
        build: .
        depends_on:
          - docker
        environment:
          - 'DOCKER_HOST=tcp://docker:2376'
          - 'DOCKER_CERT_PATH=/certs/client'
          - 'DOCKER_TLS_VERIFY=1'
        ports:
          - '8080:8080'
          - '50000:50000'
        volumes:
          - jenkins-data:/var/jenkins_home
          - jenkins-docker-certs:/certs/client:ro


volumes:
  jenkins-data:
    external: true
  jenkins-docker-certs:
    external: true
